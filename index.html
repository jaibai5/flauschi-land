<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff7ac8">
<title>Flauschi Land</title>
<link rel="manifest" href="manifest.webmanifest">

<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9f2ff;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#3a2d4a;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.stage3d{position:absolute;inset:0}
#boot{background:linear-gradient(#7fd0ff,#e8f8ff)}
.bootc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.bootc h1,.ttl{font-weight:900;color:#ff4f8b;text-shadow:0 3px 0 #fff,0 0 12px #fff;margin:0}
.bootc h1{font-size:54px}
.bootc p{font-size:20px;max-width:560px}
/* Kopfleiste */
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 14px;pointer-events:none}
.bar>*{pointer-events:auto}
.ttl{font-size:30px;flex:1}
.purse{display:flex;gap:8px}
.purse span,.small{background:rgba(255,255,255,.92);border-radius:22px;padding:8px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(90,70,104,.25)}
.small{min-width:48px;min-height:44px;font-size:17px}
/* Karte */
.labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab3d{position:absolute;left:0;top:0;pointer-events:auto;background:rgba(255,255,255,.94);border-radius:16px;padding:5px 12px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(90,70,104,.25);white-space:nowrap;text-align:center;line-height:1.15}
.lab3d small{display:block;font-weight:700;font-size:14px;color:#7d6d8c}
.lab3d.lock{opacity:.75;color:#8b8199}
.lab3d.cur{background:#ffe066;transform-origin:center}
.mapCtl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:18px;pointer-events:none}
.mapCtl>*{pointer-events:auto}
.pad{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.88);font-size:40px;box-shadow:0 5px 0 rgba(90,70,104,.3);color:#7b5cff}
.pad:active,.pad.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(90,70,104,.3);background:#fff}
.go{min-width:260px;height:96px;border-radius:48px;background:linear-gradient(#ff8fc0,#ff4f8b);color:#fff;box-shadow:0 6px 0 #c2185b;padding:6px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.go b{font-size:28px;line-height:1.1}
.go small{font-size:19px;font-weight:700;opacity:.95}
.go.off{background:linear-gradient(#cfc8d8,#a99fb8);box-shadow:0 6px 0 #7d6d8c}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c2185b}
.toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:#fff;border-radius:18px;padding:10px 20px;font-weight:800;font-size:20px;box-shadow:0 4px 0 rgba(90,70,104,.25);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90%}
.toast.on{opacity:1}
/* Spiel */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:10px 14px;pointer-events:none}
.hearts{font-size:36px;line-height:1;letter-spacing:2px;color:#ff4f8b;text-shadow:0 2px 0 #fff,0 0 6px #fff}
.hearts i{font-style:normal;color:rgba(90,70,104,.28)}
.boss{flex:1;text-align:center;font-weight:900;font-size:20px;color:#7b2a6a;text-shadow:0 2px 0 #fff}
.count{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:24px;padding:4px 14px 4px 8px;font-weight:900;font-size:26px;box-shadow:0 3px 0 rgba(90,70,104,.25)}
.ich{width:34px;height:34px}
.pause{pointer-events:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);font-weight:900;font-size:22px;box-shadow:0 3px 0 rgba(90,70,104,.25)}
.ctl{position:absolute;left:0;right:0;bottom:12px;padding:0 16px;display:flex;align-items:flex-end;gap:16px;pointer-events:none}
.ctl>*{pointer-events:auto}
.ctl .jump{margin-left:auto;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb3d6,#ff4f8b);color:#fff;font-weight:900;font-size:28px;box-shadow:0 6px 0 #c2185b}
.ctl .jump.on{transform:translateY(4px);box-shadow:0 2px 0 #c2185b}
.say{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:18px;padding:10px 20px;font-weight:800;font-size:21px;max-width:80%;text-align:center;box-shadow:0 4px 0 rgba(90,70,104,.25);opacity:0;transition:opacity .3s;pointer-events:none}
.say.on{opacity:1}
.fps{position:absolute;right:80px;top:14px;font:700 14px monospace;background:rgba(0,0,0,.5);color:#fff;padding:2px 6px;border-radius:6px;display:none}
/* Fenster */
.modal{position:absolute;inset:0;background:rgba(58,45,74,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal.on{display:flex}
.card{background:#fff;border-radius:26px;padding:20px 26px;max-width:640px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(90,70,104,.3)}
.card h2{margin:0 0 6px;font-size:30px;color:#ff4f8b}
.card p{font-size:20px;margin:8px 0;line-height:1.35}
.card .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{min-height:64px;min-width:150px;border-radius:32px;padding:10px 26px;font-weight:900;font-size:22px;background:linear-gradient(#ff8fc0,#ff4f8b);color:#fff;box-shadow:0 5px 0 #c2185b}
.btn.b2{background:#f1ecf7;color:#5a4668;box-shadow:0 5px 0 #cfc3dd}
.btn:active{transform:translateY(3px)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.chars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chars button{background:#f6f1fb;border-radius:20px;padding:4px;border:4px solid transparent;width:132px}
.chars button.sel{border-color:#ff4f8b;background:#fff0f7}
.chars img{width:120px;height:132px;display:block}
.chars b{display:block;font-size:17px}
.name{font:inherit;font-size:22px;padding:10px 16px;border-radius:16px;border:3px solid #e1d6ee;width:260px;text-align:center;margin-top:10px}
.crowns{font-size:54px;letter-spacing:6px;margin:4px 0}
.crowns i{font-style:normal;filter:grayscale(1);opacity:.3}
.gate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:10px auto}
.gate button{min-height:56px;border-radius:14px;background:#f1ecf7;font-weight:900;font-size:22px}
.tbl{width:100%;border-collapse:collapse;font-size:18px;margin:8px 0}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid #eee4f4;text-align:left}
.testb{font-size:16px;vertical-align:middle;background:#ffcf2e;color:#5a4668;border-radius:10px;padding:3px 8px;text-shadow:none}
.card h3{margin:14px 0 4px;font-size:22px;color:#7b5cff}
.card h2 small{font-size:18px;color:#7d6d8c}
.small-note{font-size:15px;color:#7d6d8c}
/* Zurück zur Lernapp, Laden */
.back{display:inline-flex;align-items:center;text-decoration:none;color:#7b5cff;white-space:nowrap}
.shopb{position:absolute;left:14px;bottom:12px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 5px 0 rgba(90,70,104,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.shopb svg{width:46px;height:46px}
.shopb b{font-size:16px;color:#c2185b;margin-top:-2px}
.shopb:active{transform:translateY(3px)}
.card.wide{max-width:900px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tabs button{display:flex;align-items:center;gap:6px;background:#f1ecf7;border-radius:22px;padding:6px 14px 6px 8px;font-weight:800;font-size:18px;min-height:48px;border:3px solid transparent}
.tabs button.sel{background:#fff0f7;border-color:#ff4f8b}
.tabs svg,.purse2 svg,.buy svg{width:28px;height:28px}
.purse2{display:flex;align-items:center;justify-content:center;gap:6px;font-size:22px!important;font-weight:800}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin:8px 0}
.stk .it{background:#f8f4fc;border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.stk .it.cup{background:#fff8dc}
.stk .it.own{background:#fff;border-color:#8ce99a;box-shadow:0 3px 0 #cfeed6}
.stk .im{width:104px;height:104px;border-radius:18px;background:#fff;box-shadow:0 0 0 4px #fff,0 3px 6px rgba(90,70,104,.25);display:flex;align-items:center;justify-content:center}
.stk .it:not(.own) .im{background:#efe8f6;box-shadow:none}
.stk .it:not(.own) img{opacity:.55;filter:saturate(.35)}
.stk img{width:100px;height:100px}
.stk .nm{font-weight:800;font-size:15px;line-height:1.1;min-height:34px;display:flex;align-items:center;text-align:center}
.buy{display:flex;align-items:center;gap:4px;justify-content:center;min-height:44px;min-width:100px;border-radius:22px;background:linear-gradient(#ff8fc0,#ff4f8b);color:#fff;font-weight:900;font-size:19px;box-shadow:0 4px 0 #c2185b;padding:2px 12px}
.buy.off{background:#e4dcec;color:#8b8199;box-shadow:0 4px 0 #cfc3dd}
.got{font-weight:900;color:#2f9e44;font-size:17px;min-height:44px;display:flex;align-items:center}
@media (max-width:900px){ .ttl{font-size:22px} .purse span,.small{font-size:16px;padding:6px 10px} .bar{gap:7px} }
@media (max-height:520px){
  .shopb{width:80px;height:80px} .shopb svg{width:38px;height:38px}
  .stk .im{width:84px;height:84px} .stk img{width:80px;height:80px} .stk{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .pad{width:80px;height:80px;font-size:34px}
  .go{height:80px;min-width:220px}
  .go b{font-size:24px}
  .ctl .jump{width:112px;height:112px;font-size:24px}
  .ttl{font-size:24px}
  .purse span,.small{font-size:17px;padding:6px 11px}
  .card{padding:14px 18px}
  .card h2{font-size:25px}
  .card p{font-size:18px}
  .btn{min-height:56px;font-size:20px}
  .chars img{width:96px;height:106px}
  .chars button{width:106px}
}
</style>

<script>window.FLMETA = {"version":"0.5.0","built":"28.11.2026 18:46","credits":[["Idee, Konzept, Architektur, Projektleitung und Tests","M.G."],["Programmiert von","KI Claude Opus 5.5 (Anthropic)"]],"note":"Gemeinsames Belohnungsspiel der Flauschi-Lernapps. Tickets kommen aus den Lernapps (Flauschi-Konto auf diesem Gerät). Alle Figuren und Monster selbst gestaltet; Bäume, Blumen und Steine in 3D aus den freien Kenney-Paketen (CC0, kenney.nl), 3D mit three.js (MIT). Keine Daten nach außen, keine Werbung, keine Käufe."};</script>
<script>/* Flauschi-Konto v1 – gemeinsames Punktekonto aller Flauschi-Lernapps (Klarinette, Englisch, Mathe, …).
   Vertrag: docs/FLAUSCHI_KONTO.md. Diese Datei wird in jede Lern-App unverändert kopiert (Prüfsumme vergleichen).
   Funktioniert nur, wenn alle Apps unter derselben Herkunft laufen: https://jaibai5.github.io/<app>/
   Lern-Apps rufen nur earn() und setProfile() auf. Ausgeben (spend) darf nur die App mit Laden und Spiel. */
(function (root) {
  'use strict';
  var KEY = 'flauschi_konto_v1', V = 1, LOG_MAX = 300, APP_RE = /^[a-z][a-z0-9-]{1,23}$/;

  function today(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function int(x) { return Math.max(0, Math.floor(+x || 0)); }
  function fresh() { return { v: V, stars: 0, tix: 0, name: '', char: '', own: [], wear: {}, set: { gameLimit: 5 }, apps: {}, log: [] }; }
  function fill(o) {
    var f = fresh(), k;
    o.stars = int(o.stars); o.tix = int(o.tix);
    for (k in f) if (o[k] === undefined || o[k] === null || typeof o[k] !== typeof f[k] || Array.isArray(o[k]) !== Array.isArray(f[k])) o[k] = f[k];
    o.stars = int(o.stars); o.tix = int(o.tix); o.name = String(o.name).slice(0, 20);
    return o;
  }
  function store() { try { return root.localStorage; } catch (e) { return null; } }
  function read() {
    var ls = store();
    try { var o = JSON.parse((ls && ls.getItem(KEY)) || 'null'); if (o && typeof o === 'object' && !Array.isArray(o) && typeof o.v === 'number') return fill(o); } catch (e) {}
    return fresh();
  }
  function write(o) { var ls = store(); try { if (!ls) return false; ls.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
  function checkApp(app) { if (!APP_RE.test(String(app))) throw new Error('FlauschiKonto: ungültiger App-Name "' + app + '" (klein, z. B. "englisch")'); }
  function book(o, app, stars, tix, why) {
    var a = o.apps[app] || (o.apps[app] = { stars: 0, tix: 0, last: '' });
    if (stars > 0) a.stars += stars; if (tix > 0) a.tix += tix; a.last = today();
    o.log.push({ t: Date.now(), app: app, stars: stars, tix: tix, why: String(why || '').slice(0, 60) });
    if (o.log.length > LOG_MAX) o.log = o.log.slice(-LOG_MAX);
  }

  // Gutschrift für echte Lernleistung. Gibt den neuen Stand zurück.
  function earn(app, stars, tix, why) {
    checkApp(app); stars = int(stars); tix = int(tix);
    var o = read(); if (!stars && !tix) return o;
    o.stars += stars; o.tix += tix; book(o, app, stars, tix, why); write(o); return o;
  }
  // Ausgabe (Laden, Spielrunde). false, wenn nicht genug da ist; dann ändert sich nichts.
  function spend(app, stars, tix, why) {
    checkApp(app); stars = int(stars); tix = int(tix);
    var o = read(); if (o.stars < stars || o.tix < tix) return false;
    o.stars -= stars; o.tix -= tix; book(o, app, -stars, -tix, why); write(o); return o;
  }
  // Name und Figur: leere Werte überschreiben nie vorhandene.
  function setProfile(p) {
    p = p || {}; var o = read();
    if (p.name && String(p.name).trim()) o.name = String(p.name).trim().slice(0, 20);
    if (p.char && String(p.char).trim()) o.char = String(p.char).trim().slice(0, 12);
    write(o); return o;
  }
  // Summe je App in den letzten n Tagen (für Elternbereiche): { klarinette: { stars, tix }, … }
  function week(n) {
    var from = Date.now() - (n || 7) * 864e5, out = {};
    read().log.forEach(function (e) { if (e.t >= from && (e.stars > 0 || e.tix > 0)) { var s = out[e.app] || (out[e.app] = { stars: 0, tix: 0 }); s.stars += Math.max(0, e.stars); s.tix += Math.max(0, e.tix); } });
    return out;
  }
  // Andere Tabs/Apps haben das Konto geändert.
  function onChange(fn) { if (root.addEventListener) root.addEventListener('storage', function (e) { if (e.key === KEY) fn(read()); }); }
  // Browser bitten, den Speicher nicht automatisch zu löschen (einmal beim Start aufrufen).
  function persist() { try { if (root.navigator && navigator.storage && navigator.storage.persist) return navigator.storage.persist(); } catch (e) {} return Promise.resolve(false); }

  root.FlauschiKonto = { KEY: KEY, V: V, read: read, earn: earn, spend: spend, setProfile: setProfile, week: week, onChange: onChange, persist: persist, today: today };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Flauschi Land · Spiellogik ohne Grafik (läuft im Browser und in Node für die Tests).
   Koordinaten: x nach rechts, y nach oben, Boden y = 0, 1 Einheit ≈ eine Figur. Feste Schrittweite 1/60 s.
   FL.newRun(level) -> Zustand; FL.step(st, inp) mit inp = { l, r, jp } (jp = Sprung gerade gedrückt).
   FL.revive(st) setzt nach 0 Herzen am letzten Tor fort. FL.bot(st) liefert Eingaben für den simulierten Spieler.
   FL.save: Spielstand flauschi_land_v1 (Schlüssel nie ändern). FL.canStart: Ticket, Tageslimit, Freischaltung. */
(function (root) {
'use strict';
const FL = root.FL = root.FL || {};
const DT = 1 / 60;
const P = FL.PHYS = { G: 32, JUMP: 12.5, JUMP2: 11, RUN: 5.2, ACC: 45, AIR: 30, FALL: -22, PW: 0.8, PH: 1.0, INV: 1.6, KNOCK: 0.3, HEARTS: 4, BOUNCE: 10, SUPER: 19, SPRING: 16.5,
  // ab Land 4/5: Seerose sinkt (Einheiten/s) und ist bei LILY_MAX unter Wasser; morscher Ast bricht nach CRACK s, wächst nach REGROW s nach; Schlamm bremst
  LILY_SINK: 0.3, LILY_RISE: 0.5, LILY_MAX: 0.5, CRACK: 0.7, REGROW: 3.2, MUD: 0.5,
  // ab Land 6: Treibsand bremst und lässt einsinken (SINK Einheiten/s bis SINK_MAX; dann langsamer und schwächerer Sprung, nie gefangen),
  // Windböen schieben in der Luft nach rechts (WIND Einheiten/s)
  SAND: 0.55, SINK: 0.4, SINK_MAX: 0.6, WIND: 3.0,
  // ab Land 7: Flöße schaukeln auf den Wellen (BOB hoch und runter, Takt BOB_W), treibende Flöße fahren hin und her (Takt DRIFT_W)
  BOB: 0.15, BOB_W: 2.4, DRIFT_W: 0.9 };
FL.DT = DT;

/* ---------- Monster ---------- */
// sp = Lauftempo, w/h = Größe, hp = Treffer
const MON = FL.MON = {
  normal:  { sp: 1.5, w: 0.9, h: 0.8, hp: 1, col: 0xff5ab4 },

    if (m.x < lo) { m.x = lo; m.vx = Math.abs(m.vx); } if (m.x > hi) { m.x = hi; m.vx = -Math.abs(m.vx); }

  } else if (m.type === 'popper') {
    // versteckt -> taucht auf (Figur nah) -> oben -> taucht ab -> Pause

    if (m.ph === 'hide') { if (m.cd <= 0 && Math.abs(p.x - m.x) < d.near) { m.ph = 'rise'; ev(st, 'pop', m.x, gy()); } }
    else if (m.ph === 'rise') { m.up = Math.min(1, m.up + dt / d.rise); if (m.up >= 1) { m.ph = 'up'; m.ut = d.up; } }
    else if (m.ph === 'up') { m.ut -= dt; if (m.ut <= 0) m.ph = 'sink'; }
    else if (m.ph === 'sink') { m.up = Math.max(0, m.up - dt / d.rise); if (m.up <= 0) { m.ph = 'hide'; m.cd = d.rest; } }
  } else if (m.type === 'blower') {
    // läuft -> holt Luft (bläst die Backen auf) -> pustet: schiebt die Figur zurück, kostet kein Herz

    else if (m.ph === 'suck') { if (m.bt <= 0) { m.ph = 'blow'; m.bt = d.blow; ev(st, 'blow', m.x, m.y); } }
    else if (m.ph === 'blow') {
      const dx = p.x - m.x;
      if (Math.sign(dx) === m.dir && Math.abs(dx) < d.reach && Math.abs(p.y - m.y) < 2.6 && !st.done) p.x += m.dir * d.push * (p.ground ? 1 : 1.3) * dt;

    }
  } else if (m.type === 'swarm') {
    m.x = m.x0 + Math.sin(m.t * 0.8) * m.patrol; m.vx = Math.cos(m.t * 0.8);
  } else if (m.type === 'wisp') {

  } else if (m.type === 'fish') {
    // unter Wasser (Blasen kurz vorher) -> Sprung im Bogen über die Wasserstelle -> unter Wasser, nächstes Mal in die andere Richtung

    if (ph < d.under) { m.fy = -1; m.x = m.x0 - dir * m.patrol; m.warn = ph > d.under - d.warn; }
    else { const k = (ph - d.under) / d.air; m.warn = false; m.x = m.x0 - dir * m.patrol + dir * 2 * m.patrol * k; m.fy = -0.7 + 4 * (d.H + 0.7) * k * (1 - k); m.vx = dir; if (m.n !== n) { m.n = n; ev(st, 'leap', m.x, 0); } }
  } else if (m.type === 'diver') {
    // kreist oben -> sieht die Figur unter sich, kreischt (Warnung) -> stürzt sich schräg herab -> fliegt wieder hoch
    if (m.cd > 0) m.cd -= dt;
    if (m.ph === 'fly') {
      m.x += m.vx * dt; if (m.x > m.x0 + m.patrol) m.vx = -d.sp; if (m.x < m.x0 - m.patrol) m.vx = d.sp; m.dy = Math.min(0, m.dy + 3 * dt);
      if (m.cd <= 0 && m.dy >= 0 && Math.abs(p.x - m.x) < d.near && p.y < gy() + d.fly - 1.8) { m.ph = 'aim'; m.at = d.aim; m.vx = p.x < m.x ? -0.01 : 0.01; ev(st, 'screech', m.x, m.y); }
    } else if (m.ph === 'aim') { m.at -= dt; if (m.at <= 0) { const dx = p.x - m.x, dy = p.y + 0.4 - m.y, l = Math.hypot(dx, dy) || 1; m.ph = 'dive'; m.dvx = dx / l * d.dive; m.dvy = dy / l * d.dive; m.vx = m.dvx; m.ty = Math.max(gy() + 0.15, p.y + 0.4); m.dt0 = 0; } }
    else if (m.ph === 'dive') { m.x += m.dvx * dt; m.dy += m.dvy * dt; m.dt0 += dt; if (gy() + d.fly + m.dy <= m.ty || m.dt0 > 1.2) { m.ph = 'fly'; m.cd = d.cd; m.vx = Math.sign(m.dvx || 1) * d.sp; } }
  } else if (m.type !== 'hover') walk(m, dt);
  if (m.safe > 0) m.safe -= dt;
  const g = gy();
  m.y = g;

  if (m.type === 'popper') m.y = g - (1 - m.up) * m.h;
  if (m.type === 'swarm') m.y = g + 0.9 + Math.abs(((m.t * 1.6) % 2) - 1) * 1.0; // Zickzack
  if (m.type === 'wisp') m.y = g + 0.9 + Math.sin(m.t * 1.8) * 0.4;
  if (m.type === 'fish') m.y = g + m.fy;
  if (m.type === 'diver') m.y = g + d.fly + m.dy + (m.ph === 'aim' ? Math.sin(m.t * 40) * 0.05 : m.ph === 'fly' ? Math.sin(m.t * 2.5) * 0.15 : 0);

    m.y = g + d.fly + Math.sin(m.t * 2.2) * 0.15; m.ft += dt;
    if (m.ft > d.every && Math.abs(p.x - m.x) < d.near) { m.ft = 0; st.shots.push({ x: m.x, y: m.y - 0.05, vy: -0.5 }); ev(st, 'hail', m.x, m.y); }
  }
  if (m.type === 'farter') { m.ft = (m.ft || 0) + dt; if (m.ft > 3) { m.ft = 0; st.clouds.push({ x: m.x - Math.sign(m.vx || 1) * 0.6, y: g + 0.5, t: 2.2 }); ev(st, 'fart', m.x, m.y); } }
  // Berührung mit der Figur (Auftaucher nur, wenn er oben ist)
  if (m.type === 'popper' && m.up < 0.6) return;
  if (m.type === 'wisp' && m.vis < 0.6) return; // Irrlicht unsichtbar: harmlos, nicht zu treffen
  if (m.type === 'fish' && m.fy < -0.4) return; // Springfisch unter Wasser: harmlos
  if (!overlap(p.x, p.y, P.PW * 0.85, P.PH * 0.9, m.x, m.y, m.w * 0.9, m.h)) return;
  if (p.vy < 0 && py0 >= m.y + m.h * 0.45) {
    if (m.type === 'spiky' && m.spk) { hurt(st, p.x < m.x ? 1 : -1); p.vy = 8; return; } // Stacheln draußen: autsch
    m.hp--; st.stomps++;
    if (m.hp <= 0) { m.state = 'sleep'; m.y = g; m.jy = 0; if (m.type === 'popper') m.up = 1; ev(st, 'stomp', m.x, m.y + m.h, { m: m.type }); if (m.type === 'splitter') split(st, m); }
    else { m.w *= 0.85; m.h *= 0.85; m.vx = Math.sign(m.vx || -1) * d.sp * 1.6; ev(st, 'hit', m.x, m.y + m.h); }
    p.vy = m.type === 'bouncer' && m.hp <= 0 ? P.SUPER : P.BOUNCE; p.jumps = 1; p.y = Math.max(p.y, m.y + m.h * 0.6);

}
function walk(m, dt) {
  m.x += m.vx * dt;

}
// Teiler: zwei kleine Wölkchen laufen auseinander (kurz harmlos, damit die Figur nicht gleich ein Herz verliert)
function split(st, m) {
  [-1, 1].forEach(s => {
    const k = newMon('normal', m.x + s * 0.5, 2.2, st.mons.length, m.base === null ? undefined : m.base);
    k.x0 = m.x + s * 1.6; k.vx = s * 2.2; k.w = 0.65; k.h = 0.6; k.kid = 1; k.look = 'splitter'; k.safe = 0.7; st.mons.push(k);
  });

}

/* ---------- Endgegner ----------
   wait -> roar -> roll (über die Arena) -> stomp ×n (Stampfwellen am Boden) -> tired (Kopf leuchtet: jetzt draufspringen) -> roll …
   Draufspringen außerhalb von tired: Figur federt ab, kein Herz weg, kein Treffer. Seitlich (roll/stomp) kostet ein Herz. */
function stepBoss(st, py0) {
  const b = st.boss, d = BOSS[b.type], p = st.p, L = st.L, dt = DT;
  if (b.state === 'wait') { if (st.arena) { b.state = 'roar'; b.t = 0; ev(st, 'roar', b.x, b.h); } return; }
  b.t += dt;
  const lo = L.arena[0] + 1.6, hi = L.arena[1] - 1.6;
  if (b.type === 'donner') stepDonner(st, b, d, p, lo, hi);
  else if (b.type === 'pilz') stepPilz(st, b, d, p, lo, hi);
  else if (b.type === 'quabbel') stepQuabbel(st, b, d, p, lo, hi);
  else if (b.type === 'knorz') stepKnorz(st, b, d, p, lo, hi);
  else if (b.type === 'sabbel') stepSabbel(st, b, d, p, lo, hi);
  else if (b.type === 'tenta') stepTenta(st, b, d, p, lo, hi);
  else if (b.state === 'roar') { if (b.t > 1.4) { b.state = 'roll'; b.t = 0; b.dir = p.x < b.x ? -1 : 1; } }
  else if (b.state === 'roll') {
    b.x += b.dir * d.roll * dt;
    if ((b.dir < 0 && b.x <= lo) || (b.dir > 0 && b.x >= hi)) { b.x = Math.max(lo, Math.min(hi, b.x)); b.state = 'stomp'; b.t = 0; b.n = 0; b.vy = d.hop; b.ground = false; }
  } else if (b.state === 'stomp') {
    if (!b.ground) { b.vy -= 30 * dt; b.y += b.vy * dt; if (b.y <= 0) { b.y = 0; b.ground = true; b.n++; b.t = 0; st.waves.push({ x: b.x - d.w / 2, dir: -1 }, { x: b.x + d.w / 2, dir: 1 }); ev(st, 'boom', b.x, 0); } }
    else if (b.t > 0.7) { if (b.n >= d.stomps) { b.state = 'tired'; b.t = 0; ev(st, 'tired', b.x, b.h); } else { b.vy = d.hop; b.ground = false; } }
  } else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) { b.state = 'roll'; b.t = 0; b.dir = b.x < (lo + hi) / 2 ? 1 : -1; } }
  else if (b.state === 'hit') { if (b.t > 1.0) { if (b.hp <= 0) bossFree(st, b); else { b.state = 'roll'; b.t = 0; b.dir = b.x < (lo + hi) / 2 ? 1 : -1; } } }
  // Stampf- bzw. Sporenwellen
  for (let i = st.waves.length - 1; i >= 0; i--) {
    const w = st.waves[i]; w.x += w.dir * d.wave * dt;
    if (w.x < L.arena[0] - 1 || w.x > L.arena[1] + 1) { st.waves.splice(i, 1); continue; }
    if (p.y < d.waveH && Math.abs(p.x - w.x) < 0.45) hurt(st, w.dir > 0 ? -1 : 1);
  }
  // Blitze: erst Schatten am Boden (warn), dann schlägt er ein (strike)
  // (Knorz: Wurzeln, vorher Risse im Boden; gleiche Regel)
  for (let i = st.bolts.length - 1; i >= 0; i--) {
    const z = st.bolts[i], bd = BOSS.donner, warn = z.warn || bd.warn, strike = z.strike || bd.strike; z.t += dt;
    if (z.t >= warn && !z.hit) { z.hit = true; ev(st, z.k === 'root' ? 'root' : 'zap', z.x, 0); }
    if (z.t >= warn + strike) { st.bolts.splice(i, 1); continue; }
    if (z.hit && Math.abs(p.x - z.x) < (z.w || bd.boltW) && p.y < (z.h || 3.2)) hurt(st, p.x < z.x ? 1 : -1);
  }

  if (p.vy < 0 && py0 >= b.y + b.h * (b.state === 'tired' ? 0.4 : 0.55)) {
    p.vy = P.BOUNCE * 1.1; p.jumps = 1; p.y = Math.max(p.y, b.y + b.h * 0.7);
    if (b.state === 'tired') { b.hp--; b.state = 'hit'; b.t = 0; st.waves.length = 0; st.bolts.length = 0; ev(st, 'bosshit', b.x, b.h, { hp: b.hp }); }

function bossFree(st, b) {
  b.state = 'free'; b.t = 0; st.bolts.length = 0; st.waves.length = 0;
  st.mons.forEach(m => { if (m.mini && m.state !== 'sleep') { m.state = 'sleep'; m.jy = 0; m.y = 0; } });
  ev(st, 'free', b.x, b.h);

// Donnerbrumm: float (zur Figur schweben) -> zap ×n (Blitze mit Schatten) -> sink -> tired (am Boden) -> rise -> float …
function stepDonner(st, b, d, p, lo, hi) {
  const dt = DT, follow = sp => { const tx = Math.max(lo, Math.min(hi, p.x)); b.x += Math.max(-sp * dt, Math.min(sp * dt, tx - b.x)); };
  if (b.state === 'roar') { if (b.t > 1.4) { b.state = 'float'; b.t = 0; } }
  else if (b.state === 'float') { follow(d.sp); if (b.t > 1.3) { b.state = 'zap'; b.t = 0; b.n = 0; } }
  else if (b.state === 'zap') {
    follow(d.sp * 0.5);
    if (b.n < d.zaps && b.t >= b.n * d.every) { b.n++; const L = st.L, x = Math.max(L.arena[0] + 0.8, Math.min(L.arena[1] - 0.8, p.x)); st.bolts.push({ x, t: 0, hit: false }); ev(st, 'warn', x, 0); }
    if (b.n >= d.zaps && !st.bolts.length) { b.state = 'sink'; b.t = 0; }
  } else if (b.state === 'sink') { b.y = Math.max(0, b.y - dt * d.fly / 0.9); if (b.y <= 0) { b.state = 'tired'; b.t = 0; ev(st, 'tired', b.x, b.h); } }
  else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) { b.state = 'rise'; b.t = 0; } }
  else if (b.state === 'rise') { b.y = Math.min(d.fly, b.y + dt * d.fly / 0.9); if (b.y >= d.fly) { b.state = 'float'; b.t = 0; } }
  else if (b.state === 'hit') { if (b.t > 1.0) { if (b.hp <= 0) bossFree(st, b); else { b.state = 'rise'; b.t = 0; } } }
  else if (b.state === 'free') { b.y = Math.min(2.2, b.y + dt); }

// Großer Zauberpilz: hop ×n zur Figur (Sporenwellen beim Landen) -> rain (kleine Hopspilze fallen) -> tired -> hop …
function stepPilz(st, b, d, p, lo, hi) {
  const dt = DT;
  const jump = () => { b.vy = d.hop; b.ground = false; b.dir = p.x < b.x ? -1 : 1; };
  if (b.state === 'roar') { if (b.t > 1.4) { b.state = 'hop'; b.t = 0; b.n = 0; jump(); } }
  else if (b.state === 'hop') {
    if (!b.ground) {
      b.vy -= 30 * dt; b.y += b.vy * dt; b.x = Math.max(lo, Math.min(hi, b.x + b.dir * d.hopX * dt));
      if (b.y <= 0) { b.y = 0; b.ground = true; b.n++; b.t = 0; st.waves.push({ x: b.x - d.w / 2, dir: -1 }, { x: b.x + d.w / 2, dir: 1 }); ev(st, 'boom', b.x, 0); }
    } else if (b.t > 0.6) { if (b.n >= d.hops) { b.state = 'rain'; b.t = 0; b.n = 0; ev(st, 'roar', b.x, b.h); } else jump(); }
  } else if (b.state === 'rain') {
    const awake = st.mons.filter(m => m.mini && m.state !== 'sleep').length;
    if (b.n < d.rain && b.t > 0.4 + b.n * 0.5) {
      b.n++;
      if (awake < 4) {
        const L = st.L, a0 = L.arena[0] + 2, a1 = L.arena[1] - 2, x = p.x < (a0 + a1) / 2 ? a1 - b.n * 2.5 : a0 + b.n * 2.5;
        const m = newMon('jumper', Math.max(a0, Math.min(a1, x)), 1.5, st.mons.length); m.mini = true; m.jy = 6.5; m.vy = 0; m.w *= 0.85; m.h *= 0.85; st.mons.push(m); ev(st, 'rain', m.x, 6.5);
      }
    }
    if (b.t > 1.8) { b.state = 'tired'; b.t = 0; ev(st, 'tired', b.x, b.h); }
  } else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) { b.state = 'hop'; b.t = 0; b.n = 0; jump(); } }
  else if (b.state === 'hit') { if (b.t > 1.0) { if (b.hp <= 0) bossFree(st, b); else { b.state = 'hop'; b.t = 0; b.n = 0; jump(); } } }
}

// Quabbel: aim (Maul auf) -> lick (Zunge) ×n -> leap (hüpft zur Figur, Boden wackelt: Wellen) -> tired -> aim …
function stepQuabbel(st, b, d, p, lo, hi) {
  const dt = DT, face = () => { b.dir = p.x < b.x ? -1 : 1; };
  const aim = () => { b.state = 'aim'; b.t = 0; b.tl = 0; face(); ev(st, 'aim', b.x, b.h); };
  if (b.state === 'roar') { if (b.t > 1.4) { b.n = 0; aim(); } }
  else if (b.state === 'aim') { if (b.t > d.aim) { b.state = 'lick'; b.t = 0; ev(st, 'lick', b.x, 0.7); } }
  else if (b.state === 'lick') {
    const out = d.tongue / d.tsp;
    b.tl = b.t < out ? d.tongue * b.t / out : b.t < out + d.hold ? d.tongue : Math.max(0, d.tongue * (1 - (b.t - out - d.hold) / out));
    if (b.tl > 0.2) { const a = b.x + b.dir * d.w * 0.35, e = a + b.dir * b.tl; if (p.y < d.tongueY && p.x > Math.min(a, e) - 0.3 && p.x < Math.max(a, e) + 0.3) hurt(st, -b.dir); }
    if (b.t > out * 2 + d.hold) {
      b.tl = 0; b.n++;
      if (b.n < d.licks) aim();
      else { face(); b.state = 'leap'; b.t = 0; b.vy = d.leap; b.ground = false; b.x0 = b.x; b.tx = Math.max(lo, Math.min(hi, p.x - b.dir * 3.5)); ev(st, 'jumpboss', b.x, 0); }
    }
  } else if (b.state === 'leap') {
    // großer Hüpfer, landet kurz vor der Figur (nie auf ihr), dann wackelt der Boden
    b.vy -= 30 * dt; b.y += b.vy * dt; b.x = b.x0 + (b.tx - b.x0) * Math.min(1, b.t / (2 * d.leap / 30));
    if (b.y <= 0 && b.vy < 0) { b.y = 0; b.ground = true; b.state = 'land'; b.t = 0; st.waves.push({ x: b.x - d.w / 2, dir: -1 }, { x: b.x + d.w / 2, dir: 1 }); ev(st, 'boom', b.x, 0); }
  } else if (b.state === 'land') { if (b.t > 0.6) { b.state = 'tired'; b.t = 0; ev(st, 'tired', b.x, b.h); } }
  else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) { b.n = 0; aim(); } }
  else if (b.state === 'hit') { b.tl = 0; if (b.t > 1.0) { if (b.hp <= 0) bossFree(st, b); else { b.n = 0; aim(); } } }
}
// Knorz: throw ×n (Eicheln im Bogen) -> roots ×n (Risse, dann Wurzeln) -> tired (Astknoten leuchtet) -> throw …
function stepKnorz(st, b, d, p, lo, hi) {
  const L = st.L, start = () => { b.state = 'throw'; b.t = 0; b.n = 0; };
  b.dir = p.x < b.x ? -1 : 1;
  if (b.state === 'roar') { if (b.t > 1.4) start(); }
  else if (b.state === 'throw') {
    if (b.n < d.throws && b.t >= 0.5 + b.n * d.every) {
      b.n++; const sx = b.x + b.dir * 0.7, sy = b.h * 0.9, T = 1.22;
      st.shots.push({ x: sx, y: sy, vx: Math.max(-6, Math.min(6, (p.x - sx) / T)), vy: 6.5, k: 'acorn' }); ev(st, 'throw', sx, sy);
    }
    if (b.n >= d.throws && b.t > 0.5 + d.throws * d.every + 0.6) { b.state = 'roots'; b.t = 0; b.n = 0; ev(st, 'roar', b.x, b.h); }
  } else if (b.state === 'roots') {
    if (b.n < d.roots && b.t >= b.n * d.rEvery) { b.n++; const x = Math.max(L.arena[0] + 0.8, Math.min(L.arena[1] - 0.8, p.x)); st.bolts.push({ x, t: 0, hit: false, k: 'root', warn: d.warn, strike: d.strike, w: d.rootW, h: d.rootH }); ev(st, 'rumble', x, 0); }
    if (b.n >= d.roots && !st.bolts.length) { b.state = 'tired'; b.t = 0; ev(st, 'tired', b.x, b.h); }
  } else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) start(); }
  else if (b.state === 'hit') { if (b.t > 1.0) { if (b.hp <= 0) bossFree(st, b); else start(); } }
}

// Sabbel: dig (taucht ab) -> warn (Sand bewegt sich unter der Figur) -> arc (Bogen aus dem Sand) ×n -> rise -> tired (liegt erschöpft da) -> dig …
function stepSabbel(st, b, d, p, lo, hi) {
  const dt = DT, go = s => { b.state = s; b.t = 0; };
  if (b.state === 'roar') { if (b.t > 1.4) { b.n = 0; go('dig'); } }
  else if (b.state === 'dig') {
    b.y = Math.max(-1.6, b.y - dt * 1.6 / d.under);
    if (b.t >= d.under) { b.y = -1.6; b.x = Math.max(lo, Math.min(hi, p.x)); b.wx = b.x; go('warn'); ev(st, 'rumble', b.x, 0); }
  } else if (b.state === 'warn') { if (b.t >= d.warn) { b.dir = b.wx < (lo + hi) / 2 ? 1 : -1; b.x0 = b.wx; b.span = Math.min(d.span, b.dir > 0 ? hi - b.wx : b.wx - lo); go('arc'); ev(st, 'burst', b.x, 0); } }
  else if (b.state === 'arc') {
    const k = Math.min(1, b.t / d.air); b.x = b.x0 + b.dir * b.span * k; b.y = -1.4 + 4 * (d.H + 1.4) * k * (1 - k);
    if (k >= 1) { b.n++; ev(st, 'burst', b.x, 0); if (b.n < d.arcs) go('dig'); else { b.y = -1.4; go('rise'); } }
  } else if (b.state === 'rise') { b.y = -1.4 + 1.4 * Math.min(1, b.t / d.rise); if (b.t >= d.rise) { b.y = 0; go('tired'); ev(st, 'tired', b.x, b.h); } }
  else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) { b.n = 0; go('dig'); } }
  else if (b.state === 'hit') { if (b.t > 1.0) { if (b.hp <= 0) { b.y = 0; bossFree(st, b); } else { b.n = 0; go('dig'); } } }
}
// Tentakula: raise (Arm hoch) -> slam (Wellen) ×n -> throw (Seesterne im Bogen) ×n -> tired -> raise …
function stepTenta(st, b, d, p, lo, hi) {
  const go = s => { b.state = s; b.t = 0; };
  b.dir = p.x < b.x ? -1 : 1;
  const raise = () => { go('raise'); b.arm = b.dir; ev(st, 'aim', b.x, b.h); };
  if (b.state === 'roar') { if (b.t > 1.4) { b.n = 0; raise(); } }
  else if (b.state === 'raise') { if (b.t > d.raise) { go('slam'); const x = b.x + b.arm * (d.w / 2 + 0.4); st.waves.push({ x, dir: b.arm }); ev(st, 'boom', x, 0); ev(st, 'slap', x, 0); } }
  else if (b.state === 'slam') { if (b.t > 0.7) { b.n++; if (b.n < d.slams) raise(); else { b.n = 0; go('throw'); } } }
  else if (b.state === 'throw') {
    if (b.n < d.throws && b.t >= 0.4 + b.n * d.every) {
      b.n++; const sx = b.x + b.dir * 0.9, sy = b.h * 0.9, T = 1.15;
      st.shots.push({ x: sx, y: sy, vx: Math.max(-6, Math.min(6, (p.x - sx) / T)), vy: 6.5, k: 'star' }); ev(st, 'throw', sx, sy);
    }
    if (b.n >= d.throws && b.t > 0.4 + d.throws * d.every + 0.6) { go('tired'); ev(st, 'tired', b.x, b.h); }
  } else if (b.state === 'tired') { if (b.t > FL.tiredTime(st)) { b.n = 0; raise(); } }
  else if (b.state === 'hit') { if (b.t > 1.0) { if (b.hp <= 0) bossFree(st, b); else { b.n = 0; raise(); } } }
}

// Müde-Zeit: wird länger, wenn die Figur in der Arena schon Herzen verloren hat (kleine Hilfe)
FL.tiredTime = st => BOSS[st.boss.type].tired + Math.min(2, (st.bossHurts || 0) * 0.5);

/* ---------- nach 0 Herzen: weiter am letzten Tor (ohne neues Ticket) ---------- */
FL.revive = st => {
  const p = st.p; st.down = false; st.hearts = P.HEARTS;
  p.x = gatePos(st); p.y = hillAt(st.L, p.x); p.vx = 0; p.vy = 0; p.inv = 2; p.knock = 0; p.jumps = 0; p.salto = 0; p.ground = true;
  st.clouds.length = 0; st.waves.length = 0; st.bolts.length = 0; st.shots.length = 0; st.bossHurts = 0; st.lily = {}; st.brk = {};
  for (let i = st.mons.length - 1; i >= 0; i--) if (st.mons[i].mini) st.mons.splice(i, 1);
  if (st.boss && st.boss.state !== 'free') { const nb = newBoss(st.L); Object.assign(st.boss, nb); st.arena = false; }
  // Monster in der Nähe des Tors zurück auf ihren Platz (nicht direkt neben der Figur)
  st.mons.forEach(m => { if (m.state !== 'sleep' && Math.abs(m.x - p.x) < 4) { m.x = m.x0; } });
  ev(st, 'revive', p.x, 0);
  return st;
};

/* ---------- Ergebnis ---------- */
FL.crowns = (got, total) => { const q = total ? got / total : 1; return q >= 0.85 ? 3 : q >= 0.5 ? 2 : 1; };

/* ---------- simulierter Spieler ----------
   Probiert alle paar Bilder mehrere Eingabe-Pläne in einer Kopie des Zustands aus (gleiche Logik) und nimmt den besten:
   kein Herz verlieren, vorankommen, Endgegner treffen, Sachen sammeln. */
function cloneNear(st) {
  const p = st.p, near = o => Math.abs(o.x - p.x) < 14;
  return {
    L: st.L, t: st.t, hearts: st.hearts, got: 0, total: 0, gate: st.gate, down: false, done: false, arena: st.arena, stomps: 0, hurts: 0, falls: 0,
    p: Object.assign({}, p), items: st.items.filter(i => !i.got && near(i)).map(i => ({ x: i.x, y: i.y, got: false })), hearts2: [],
    lily: Object.assign({}, st.lily), brk: Object.fromEntries(Object.entries(st.brk).map(([k, v]) => [k, Object.assign({}, v)])),
    mons: st.mons.filter(near).map(m => Object.assign({}, m)), clouds: st.clouds.map(c => Object.assign({}, c)), shots: st.shots.map(c => Object.assign({}, c)), waves: st.waves.map(w => Object.assign({}, w)), bolts: st.bolts.map(z => Object.assign({}, z)), bossHurts: st.bossHurts || 0,
    boss: st.boss ? Object.assign({}, st.boss) : null, ev: null
  };
}
// Plan = Laufrichtung, Sprung nach j Sekunden (oder nie), zweiter Sprung j2 Sekunden danach (oder nie)
const PLANS = [];
[1, 0, -1].forEach(mv => (mv > 0 ? [null, 0, 0.15, 0.3, 0.5] : [null, 0]).forEach(j => (j === null ? [null] : mv > 0 ? [null, 0.22, 0.42] : [null, 0.3]).forEach(j2 => PLANS.push({ mv, j, j2 }))));
// ab Land 7: springen und nach der Landung stehen bleiben (kleine Flöße, Bojen)
[0, 0.15, 0.3].forEach(j => PLANS.push({ mv: 1, j, j2: null, stop: j + 0.75 })); PLANS.push({ mv: 1, j: 0, j2: 0.3, stop: 1.1 });
const planInp = (pl, k) => { const t = k * DT, hit = x => x !== null && Math.abs(t - x) < DT / 2, go = !(pl.stop && t > pl.stop); return { r: pl.mv > 0 && go, l: pl.mv < 0 && go, jp: hit(pl.j) || (pl.j !== null && pl.j2 !== null && hit(pl.j + pl.j2)) }; };
function score(st, plan, H) {
  const s = cloneNear(st), x0 = s.p.x, b0 = s.boss ? s.boss.hp : 0, n = Math.round(H / DT);
  for (let k = 0; k < n; k++) {
    FL.step(s, planInp(plan, k));
    if (s.hurts) return -10000 + k;
    if (s.done) return 5000 - k;
  }
  let v = s.got * 15 + s.stomps * 20;
  const B = s.boss;
  if (B && st.arena && B.state !== 'free') {
    v += (b0 - B.hp) * 2000;
    const dx = Math.abs(s.p.x - B.x);
    v += B.state === 'tired' ? -dx * 30 : -Math.abs(dx - 6) * 4;
  } else v += (s.p.x - x0) * 12;
  if (plan.j !== null) v -= 3 + plan.j * 4; if (plan.j2 !== null) v -= 3; if (plan.mv === 0) v -= 1;
  return v;
}
FL.bot = st => {
  const B = st.bot || (st.bot = { plan: PLANS[0], k: 0 });
  if (B.k >= 6) B.k = 0;
  if (B.k === 0) {
    let best = -Infinity, bp = PLANS[0];
    for (const pl of PLANS) { const v = score(st, pl, 1.5); if (v > best) { best = v; bp = pl; } }
    B.plan = bp;
  }
  return planInp(B.plan, B.k++);
};

/* ---------- Spielstand flauschi_land_v1 (Schlüssel nie ändern) ---------- */
// v2 (Session 03): fruit = gesammelte Früchte je Land (zum Ausgeben im Laden), own = gekaufte Sticker und Pokale
const SAVE_V = 2;
FL.save = {
  KEY: 'flauschi_land_v1', V: SAVE_V,
  fresh: () => ({ v: SAVE_V, unlocked: 1, lv: {}, days: {}, set: {}, fruit: {}, own: [], created: new Date().toISOString().slice(0, 10) }),
  // Alte oder kaputte Stände nie verwerfen: fehlende Felder ergänzen, Version anheben (Sicherung macht load())
  migrate(o) {
    const f = FL.save.fresh();
    if (!o || typeof o !== 'object' || Array.isArray(o)) return f;
    for (const k in f) if (o[k] === undefined || o[k] === null || typeof o[k] !== typeof f[k]) o[k] = f[k];
    o.unlocked = Math.max(1, Math.min(12, Math.floor(+o.unlocked || 1)));
    if (!Array.isArray(o.own)) o.own = []; o.own = o.own.filter(x => typeof x === 'string');
    if (Array.isArray(o.fruit)) o.fruit = {};
    o.v = SAVE_V; return o;
  },
  load(ls) {
    let raw = null; try { raw = ls && ls.getItem(FL.save.KEY); } catch (e) {}
    if (!raw) return FL.save.fresh();
    let o = null; try { o = JSON.parse(raw); } catch (e) { try { ls.setItem(FL.save.KEY + '_kaputt', raw); } catch (e2) {} return FL.save.fresh(); }
    if (o && o.v !== SAVE_V) { try { ls.setItem(FL.save.KEY + '_vor_update_v' + o.v, raw); } catch (e) {} }
    return FL.save.migrate(o);
  },
  store(ls, o) { try { ls.setItem(FL.save.KEY, JSON.stringify(o)); return true; } catch (e) { return false; } },
  // Ergebnis eintragen: beste Kronen und Sammelzahl, nächstes Land frei
  finish(o, n, got, total) {
    const id = String(n), c = FL.crowns(got, total), r = o.lv[id] || (o.lv[id] = { crowns: 0, best: 0, done: 0 });
    const first = !r.done; r.done++; r.crowns = Math.max(r.crowns, c); r.best = Math.max(r.best, got);
    if (o.unlocked < n + 1 && n < 12) o.unlocked = n + 1;
    FL.save.addFruit(o, n, got);
    return { crowns: c, first };
  },
  // Früchte gutschreiben (auch beim Abbrechen über die Pause: Gesammeltes geht nie verloren)
  addFruit(o, n, got) { const id = String(n); o.fruit[id] = Math.max(0, Math.floor(o.fruit[id] || 0)) + Math.max(0, Math.floor(got || 0)); return o.fruit[id]; }
};

/* ---------- Laden (Wunsch 25.11.): Früchte eines Landes gegen Sticker und einen Pokal tauschen ----------
   Je Land: ein Sticker pro Monsterart, ein Endgegner-Sticker und ein Pokal (steht dann auf der Insel der Weltkarte).
   Bezahlt wird nur mit den Früchten dieses Landes; Konto-Sterne bleiben fürs Lernen (KI-2). */
FL.PRICE = { stk: 15, boss: 40, cup: 100 };
FL.shopList = n => {
  const L = FL.LEVELS && FL.LEVELS[n]; if (!L) return [];
  const names = L.names || {}, seen = [], out = [];
  L.mon.forEach(m => { if (!seen.includes(m[0])) seen.push(m[0]); });
  seen.forEach(t => out.push({ id: n + ':' + t, kind: 'stk', type: t, name: names[t] || t, price: FL.PRICE.stk }));
  if (L.boss) out.push({ id: n + ':boss', kind: 'boss', type: L.boss.type, name: FL.BOSS[L.boss.type].name, price: FL.PRICE.boss });
  out.push({ id: n + ':cup', kind: 'cup', name: 'Pokal ' + FL.WORLDS[n - 1].name, price: FL.PRICE.cup });
  return out;
};
FL.buy = (sv, id) => {
  const n = parseInt(id, 10), it = FL.shopList(n).find(i => i.id === id);
  if (!it) return { ok: false, why: 'unknown' };
  if (sv.own.includes(id)) return { ok: false, why: 'own' };
  const have = sv.fruit[String(n)] || 0;
  if (have < it.price) return { ok: false, why: 'fruit', need: it.price - have };
  sv.fruit[String(n)] = have - it.price; sv.own.push(id);
  return { ok: true, left: sv.fruit[String(n)] };
};
// Darf ein Level starten? konto = FlauschiKonto.read(), sv = Spielstand
// Testmodus der Eltern (sv.set.test): alle fertigen Länder, ohne Ticket und Tageslimit
FL.canStart = (konto, sv, n, today) => {
  const W = FL.WORLDS && FL.WORLDS[n - 1], test = !!(sv.set && sv.set.test);
  if (!W || (n > sv.unlocked && !test)) return { ok: false, why: 'locked' };
  if (!W.ready) return { ok: false, why: 'soon' };
  if (test) return { ok: true, test: true };
  const lim = konto.set && typeof konto.set.gameLimit === 'number' ? konto.set.gameLimit : 5;
  const used = (sv.days[today] && sv.days[today].starts) || 0;
  if (lim > 0 && used >= lim) return { ok: false, why: 'limit', lim, used };
  if (konto.tix < 1) return { ok: false, why: 'tix' };
  return { ok: true, lim, used };
};
FL.TEST_PW = 'Aff'; // Wunsch des Menschen 22.11.: Passwort für den Testmodus im Elternbereich (kein echter Schutz, nur gegen Zufall)
FL.checkPw = pw => String(pw || '').trim() === FL.TEST_PW;
// Einstieg im Testmodus: 'start', 'gate0', 'gate1', … oder 'boss'
FL.placeAt = (st, from) => {
  const L = st.L, p = st.p, m = /^gate(\d+)$/.exec(from || '');
  if (m && L.gates && L.gates[+m[1]] !== undefined) { st.gate = +m[1]; p.x = L.gates[st.gate] + 1; }
  else if (from === 'boss' && L.arena) { st.gate = (L.gates || []).length - 1; p.x = L.arena[0] - 2.5; }
  return st;
};
FL.countStart = (sv, today) => { const d = sv.days[today] || (sv.days[today] = { starts: 0 }); d.starts++; const ks = Object.keys(sv.days).sort(); while (ks.length > 60) delete sv.days[ks.shift()]; };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Flauschi Land · Länder und Level-Daten (Gestaltung nach docs/SPIELKONZEPT.md, Levelaufbau nach der Vorlage des Menschen).

(function (root) {
'use strict';
const FL = root.FL = root.FL || {};

// Die 12 Länder (Reihenfolge = Freischaltung). ready = schon spielbar.
FL.WORLDS = [
  { n: 1, id: 'kirschiland', name: 'Kirschiland', item: 'Kirschen', boss: 'Puschel-Brummi', ready: true },

];

/* ---------- Land 1: Kirschiland ----------
   Grüne Wiese, Kirschbäume (oben landen erlaubt, seitlich Herz weg), tiefe Wolken als Plattformen, Kirschen,
   bunte Flauschmonster aller 8 Arten der Vorlage (langsam eingeführt), 2 Regenbogen-Tore, Puschel-Brummi, großer Regenbogen. */
const trees = [[14, 1.5], [38, 1.7], [52, 1.6], [75, 1.8], [96, 1.6], [118, 1.9], [140, 1.7], [165, 1.6], [186, 1.8], [205, 1.7], [228, 1.9], [250, 1.6], [272, 1.8], [295, 1.7], [318, 1.9], [340, 1.7], [358, 1.8]];

  [145, 2.0, 3], [150, 3.6, 3], [155.4, 5.0, 2.6], [180, 2.1, 3], [200, 2.0, 3], [204, 3.7, 2.6], [222, 2.1, 3], [244, 2.0, 3], [248, 3.6, 2.6], [253, 5.1, 2.6],

  [385, 2.1, 3.2]]; // Arena: tiefe Wolke in der Mitte, dort rollt Puschel-Brummi unten durch (sicherer Platz)
const items = [];
[6, 20, 43, 70, 100, 133, 160, 192, 210, 233, 266, 290, 312, 335, 362].forEach(x => { for (let k = 0; k < 3; k++) items.push([x + k * 0.9, 0.6]); });
clouds.forEach(([x, y]) => items.push([x, y + 0.6]));
trees.forEach(([x, h]) => items.push([x, h + 0.6]));
FL.LEVELS = {
  1: {
    n: 1, id: 'kirschiland', theme: 'kirsch', len: 404, end: 399, trees, clouds, items,
    hearts: [[93, 0.8], [204, 4.3], [331, 0.8]],
    mon: [['normal', 24, 3], ['bouncer', 46, 2], ['fast', 63, 5], ['jumper', 86, 3], ['farter', 107, 3], ['hover', 125, 0], ['big', 152, 4], ['charger', 176, 4],
      ['farter', 196, 3], ['bouncer', 216, 3], ['jumper', 238, 3], ['fast', 258, 3], ['big', 284, 4], ['hover', 306, 0], ['farter', 328, 3], ['charger', 349, 3], ['normal', 365, 2]],
    gates: [128, 262], arena: [376, 394], boss: { type: 'puschel', x: 390 }, // Arena so schmal, dass sie ganz ins Bild passt
    names: { normal: 'Rosa Flausch', bouncer: 'Federflausch', fast: 'Flitzflausch', jumper: 'Hüpfflausch', farter: 'Pupsflausch', hover: 'Schwebeflausch', big: 'Dicker Brocken', charger: 'Rempelflausch' },
    text: { intro: 'Sammle Kirschen! Hüpf auf die Monster. Puschel-Brummi wartet am Ende.', boss: 'Puschel-Brummi! Auf der Wolke bist du sicher. Leuchtet sein Kopf, spring drauf!', help: 'Tipp: Hüpf auf die Wolke in der Mitte. Wenn Puschel-Brummi müde ist und sein Kopf leuchtet, lauf hin und spring auf den Kopf!', end: 'Puschel-Brummi ist wieder lieb!' }
  },

  /* ---------- Land 2: Regenbogenland ----------
     Umbau Session 03 (Wunsch 25.11.): Der Boden ist nur noch EIN riesiger Regenbogen. Erst geht es hinauf bis über die
     Regenwolken, dann wieder hinunter. Kurz vor dem Boden wartet Donnerbrumm auf einer Wolkenbank.
     Im Regenbogen sind Lücken, über die Wolken helfen. Über dem Bogen liegen Wolkenwege, rosa Sprungwolken federn hoch.
     Wolkengegner mit verschiedenen Eigenschaften (siehe names). */
  2: (() => {
    const A0 = -6, A1 = 366, H = 22, hills = [[A0, A1, H]];
    const gh = x => (x > A0 && x < A1 ? H * Math.sin(Math.PI * (x - A0) / (A1 - A0)) : 0), r2 = v => Math.round(v * 100) / 100;
    const gaps = [[48, 53], [104, 111], [160, 165], [214, 221], [268, 273], [322, 329]];
    const clouds = [], hi = [];
    // über jeder Lücke: eine Wolke (kurze Lücke) oder eine kleine Wolkentreppe (lange Lücke)
    gaps.forEach(([a, b]) => {
      if (b - a <= 5) clouds.push([(a + b) / 2, r2(gh((a + b) / 2) + 0.9), 2.6]);
      else clouds.push([a + 1.9, r2(gh(a + 1.9) + 0.9), 2.4], [b - 1.9, r2(gh(b - 1.9) + 1.6), 2.4]);

/* ---------- Spiel ---------- */
const KEYS = { l: false, r: false, jp: false };
let G = null;
function startLevel(n, from) {
  MAP = null;
  show('game');
  const k = konto(), L = FL.LEVELS[n], st = FL.placeAt(FL.newRun(L), from), host = $('#game .stage3d');
  G = { n, st, test: TEST(), acc: 0, view: null, paused: false, over: false, said: {}, fps: { n: 0, t: 0 } };
  $('#gCount svg').innerHTML = ICON[L.theme] || ICON.kirsch; lastHud = '';
  hud();
  G.view = FL3D.level(host, { st, char: k.char || 'alpaka', wear: k.wear, tick });
  say(L.text.intro, 3.5);
}
function tick(dt) {
  if (!G) return;
  if (SHOWFPS || SIM || G.test) { const f = G.fps; f.n++; f.t += dt; if (f.t > 1) { if (SHOWFPS || G.test) $('#fps').style.display = 'block'; const ri = K3D.renderer().info.render; G.perf = { fps: Math.round(f.n / f.t), calls: ri.calls, tris: ri.triangles }; $('#fps').textContent = G.perf.fps + ' B/s · ' + ri.calls + ' DC' + (K3D.low ? ' (klein)' : ''); f.n = 0; f.t = 0; } }
  if (G.paused || G.over || isModal()) return;
  const st = G.st;
  G.acc += dt * SPEED; let n = 0;
  while (G.acc >= FL.DT && n < 8 * SPEED) {
    G.acc -= FL.DT; n++;
    const inp = SIM ? FL.bot(st) : { l: KEYS.l, r: KEYS.r, jp: KEYS.jp };
    KEYS.jp = false;
    FL.step(st, inp);
    for (const e of st.ev) onEv(e);
    st.ev.length = 0;
    if (st.down) { if (SIM) FL.revive(st); else { downScreen(); break; } }
    if (st.done) { finish(); break; }
  }
  if (G.acc > FL.DT * 4) G.acc = 0;
  hud();
}
function onEv(e) {
  if (SND[e.type]) SND[e.type]();
  if (G.view) G.view.fx(e);
  const L = G.st.L;
  if (e.type === 'arena' && !G.said.boss) { G.said.boss = 1; say(L.text.boss, 4); }
  if (e.type === 'tired' && !G.said.tired) { G.said.tired = 1; say('Jetzt! Spring auf den Kopf!', 2.2); }
  if (e.type === 'boing' && !G.said.boing) { G.said.boing = 1; say('Warte, bis der Kopf leuchtet!', 2.2); }
  if (e.type === 'bosshelp' && L.text.help) say(L.text.help, 5);
  if (e.type === 'gate') say('Regenbogen-Tor! Hier geht es weiter, wenn die Herzen alle sind.', 2.6);
  if (e.type === 'free') say(L.text.end, 3);
}
let sayT = 0;
function say(t, sec) { const e = $('#gSay'); e.textContent = t; e.classList.add('on'); clearTimeout(sayT); sayT = setTimeout(() => e.classList.remove('on'), (sec || 2.5) * 1000 / SPEED); }
let lastHud = '';
function hud() {
  const st = G.st, B = st.boss;
  const h = '♥'.repeat(st.hearts) + '<i>' + '♥'.repeat(FL.PHYS.HEARTS - st.hearts) + '</i>';
  const boss = B && st.arena && B.state !== 'free' ? FL.BOSS[B.type].name + ' ' + '★'.repeat(B.hp) : '';
  const key = h + '|' + st.got + '|' + boss;
  if (key === lastHud) return; lastHud = key;
  $('#gHearts').innerHTML = h; $('#gGot').textContent = st.got; $('#gBoss').textContent = boss;
}
function downScreen() {
  G.over = true;
  modal(`<h2>Fast geschafft!</h2><p>Die Herzen sind alle. Du machst am letzten Regenbogen-Tor weiter, mit 4 Herzen.</p><p class="small-note">Kostet kein neues Ticket.</p><div class="row"><button class="btn" data-act="revive">Weiter</button></div>`);
}
function finish() {
  G.over = true; const st = G.st, n = G.n, w = FL.WORLDS[n - 1];
  const res = G.test ? { crowns: FL.crowns(st.got, st.total), first: false, test: true } : FL.save.finish(SV, n, st.got, st.total);
  if (!G.test) { SV.cur = Math.min(n + 1, SV.unlocked); save(); }
  G.result = res;
  setTimeout(() => {
    const next = FL.WORLDS[n];
    modal(`<h2>${esc(w.name)} geschafft!</h2><div class="crowns">${'👑'.repeat(res.crowns)}<i>${'👑'.repeat(3 - res.crowns)}</i></div>
      <p>${st.got} von ${st.total} ${esc(w.item)} gesammelt.</p><p>${esc(st.L.text.end)}</p>
      ${res.test ? '' : `<p class="small-note">Im Beutel: ${SV.fruit[n] || 0} ${esc(w.item)}. Im Laden gibt es dafür Sticker und einen Pokal.</p>`}
      ${res.first && next ? `<p><b>Neu offen:</b> ${esc(next.name)}${next.ready ? '' : ' (kommt bald)'}</p>` : ''}
      ${res.test ? `<p class="small-note">Testmodus: Spielzeit ${Math.round(st.t)} s, ${st.hurts} Treffer. Nicht gespeichert.</p>` : ''}
      <div class="row"><button class="btn" data-act="tomap">Zur Karte</button></div>`);
  }, 1800 / SPEED);
}
function leaveGame() { G = null; closeModal(); FL3D.leave(); openMap(); }

function parentsGate() {

  modal(`<h2>Für Eltern</h2><p>Was ist <b>${a} × ${b}</b>?</p><div class="gate">${[...opts].filter(x => x > 0).sort(() => Math.random() - 0.5).map(x => `<button data-act="gate" data-v="${x}" data-ok="${ok}">${x}</button>`).join('')}</div><div class="row"><button class="btn b2" data-act="close">Zurück</button></div>`);

function parents() {
  const k = konto(), wk = FK.week(7), lim = k.set && typeof k.set.gameLimit === 'number' ? k.set.gameLimit : 5, used = (SV.days[today()] && SV.days[today()].starts) || 0;
  const rows = Object.keys(wk).length ? Object.entries(wk).map(([a, v]) => `<tr><td>${esc(a)}</td><td>${v.stars} ⭐</td><td>${v.tix} 🎟</td></tr>`).join('') : '<tr><td colspan="3">Noch nichts verdient.</td></tr>';
  const lv = FL.WORLDS.filter(w => SV.lv[w.n]).map(w => `<tr><td>${esc(w.name)}</td><td>${'👑'.repeat(SV.lv[w.n].crowns)}</td><td>${SV.lv[w.n].done}× geschafft</td></tr>`).join('') || '<tr><td colspan="3">Noch kein Land geschafft.</td></tr>';
  modal(`<h2>Elternbereich</h2><p>Heute gespielt: <b>${used}</b> von ${lim > 0 ? lim : 'unbegrenzt'} Level-Starts (für alle Fächer zusammen).</p>
    <p class="small-note">Das Tageslimit kommt aus dem gemeinsamen Flauschi-Konto. Einstellen lässt es sich bald hier.</p>
    <table class="tbl"><tr><th>Lernapp (7 Tage)</th><th>Sterne</th><th>Tickets</th></tr>${rows}</table>
    <table class="tbl"><tr><th>Land</th><th>Kronen</th><th></th></tr>${lv}</table>
    <p class="small-note">Konto jetzt: ${k.tix} 🎟, ${k.stars} ⭐. Figur: ${esc(CHAR_NAMES[k.char] || '–')}${k.name ? ', Name: ' + esc(k.name) : ''}.</p>
    <h3>Level testen</h3>${TEST() ? `<p>Testmodus ist <b>an</b>: alle fertigen Länder ohne Ticket, Einstieg auch am Tor oder beim Endgegner. Der Spielstand des Kindes bleibt unverändert.</p><div class="row"><button class="btn b2" data-act="testoff">Testmodus aus</button></div>`
      : `<p class="small-note">Mit Passwort: alle Länder ohne Ticket testen.</p><input class="name" id="pwI" type="password" autocomplete="off" placeholder="Passwort"><div class="row"><button class="btn b2" data-act="teston">Testmodus an</button></div><p class="small-note" id="pwMsg"></p>`}
    <h3>Vollbild</h3><p class="small-note">Auf dem Tablet geht das Spiel beim ersten Tippen in den Vollbildmodus.</p><div class="row"><button class="btn b2" data-act="fullset">Vollbild: ${(SV.set.full || 'auto') === 'off' ? 'aus' : 'automatisch'}</button></div>
    <div class="row"><button class="btn b2" data-act="who">Figur ändern</button><button class="btn" data-act="close">Fertig</button></div>`);
}
function about() {
  const M = window.FLMETA;
  modal(`<h2>Flauschi Land</h2><p>Version ${esc(M.version)} · ${esc(M.built)}</p>${M.credits.map(c => `<p><b>${esc(c[0])}:</b> ${esc(c[1])}</p>`).join('')}<p class="small-note">${esc(M.note)}</p><div class="row"><button class="btn" data-act="close">Schließen</button></div>`);
}

/* ---------- Bedienung ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'close') { closeModal(); if (MAP) updateGo(); }
  else if (a === 'mleft' && MAP) MAP.step(-1);
  else if (a === 'mright' && MAP) MAP.step(1);
  else if (a === 'mgo' && MAP && !MAP.walking) tryStart(CUR);
  else if (a === 'isl' && MAP) MAP.go(+b.dataset.n);
  else if (a === 'play') play(+b.dataset.n);
  else if (a === 'testplay') { if (TEST()) { closeModal(); startLevel(+b.dataset.n, b.dataset.f); } }
  else if (a === 'teston') { if (FL.checkPw($('#pwI').value)) { SV.set.test = true; save(); closeModal(); openMap(); toast('Testmodus an'); } else { $('#pwMsg').textContent = 'Falsches Passwort.'; $('#pwI').value = ''; } }
  else if (a === 'testoff') { delete SV.set.test; save(); closeModal(); openMap(); toast('Testmodus aus'); }
  else if (a === 'revive') { closeModal(); FL.revive(G.st); G.over = false; say('Weiter geht es!', 1.5); }
  else if (a === 'tomap') leaveGame();
  else if (a === 'pause' && G && !G.over) { G.paused = true; modal(`<h2>Pause</h2><div class="row"><button class="btn b2" data-act="quit">Zur Karte</button><button class="btn" data-act="resume">Weiter</button></div><p class="small-note">Zur Karte beendet das Level (das Ticket ist dann verbraucht).</p>`); }
  else if (a === 'resume') { G.paused = false; closeModal(); }
  else if (a === 'quit') { if (G && !G.test) { FL.save.addFruit(SV, G.n, G.st.got); save(); } leaveGame(); }
  else if (a === 'parents') parentsGate();
  else if (a === 'gate') { if (b.dataset.v === b.dataset.ok) parents(); else { closeModal(); toast('Das war nicht richtig.'); } }
  else if (a === 'fullset') { SV.set.full = (SV.set.full || 'auto') === 'off' ? 'auto' : 'off'; save(); b.textContent = 'Vollbild: ' + (SV.set.full === 'off' ? 'aus' : 'automatisch'); if (SV.set.full === 'off' && (document.fullscreenElement || document.webkitFullscreenElement)) (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else if (a === 'who') { closeModal(); whoPicker(); }
  else if (a === 'about') about();
  else if (a === 'back') { if (!FROM) { e.preventDefault(); backChooser(); } }
  else if (a === 'shop' && MAP && !MAP.walking) { SHOP_N = 0; shop(); }
  else if (a === 'shopn') shop(+b.dataset.n);
  else if (a === 'buy') buy(b.dataset.id);
  else if (a === 'shopclose') shopClose();
});
// Spiel-Knöpfe: gedrückt halten (mehrere Finger gleichzeitig)
function hold(id, on, off) {
  const el = $(id), down = e => { e.preventDefault(); el.classList.add('on'); on(); }, up = e => { e.preventDefault(); el.classList.remove('on'); if (off) off(); };
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
}
hold('#bL', () => { KEYS.l = true; }, () => { KEYS.l = false; });
hold('#bR', () => { KEYS.r = true; }, () => { KEYS.r = false; });
hold('#bJ', () => { KEYS.jp = true; });
const KL = ['ArrowLeft', 'KeyA'], KR = ['ArrowRight', 'KeyD'], KJ = ['Space', 'ArrowUp', 'KeyW'];
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'pwI' && e.code === 'Enter') { $('[data-act="teston"]').click(); return; }
  if (e.target && e.target.tagName === 'INPUT') return;
  if (G) {
    if (KL.includes(e.code)) KEYS.l = true; else if (KR.includes(e.code)) KEYS.r = true;
    else if (KJ.includes(e.code)) { if (!e.repeat) KEYS.jp = true; }
    else if (e.code === 'Escape' || e.code === 'KeyP') $('[data-act="pause"]').click();
    else if (e.code === 'Enter' && isModal()) { const b = $('#mCard .btn:not(.b2)'); if (b) b.click(); }
    if ([...KL, ...KR, ...KJ].includes(e.code)) e.preventDefault();
    return;
  }
  if (isModal()) { if (e.code === 'Enter' || e.code === 'Space') { const b = $('#mCard .btn:not(.b2)') || $('#mCard .btn'); if (b) { e.preventDefault(); b.click(); } } else if (e.code === 'Escape') { closeModal(); if (MAP) updateGo(); } return; }
  if (MAP) {
    if (KL.includes(e.code)) MAP.step(-1); else if (KR.includes(e.code)) MAP.step(1);
    else if ((e.code === 'Enter' || e.code === 'Space') && !MAP.walking) tryStart(CUR);
  }
});
document.addEventListener('keyup', e => { if (KL.includes(e.code)) KEYS.l = false; if (KR.includes(e.code)) KEYS.r = false; });
window.addEventListener('blur', () => { KEYS.l = KEYS.r = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over && !G.paused && !SIM) $('[data-act="pause"]').click(); });

// Offline: Service Worker (nur auf der Testseite, nicht file://)
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

// Für Tests
window.FLAPP = { get SV() { return SV; }, set SV(v) { SV = v; }, get G() { return G; }, get MAP() { return MAP; }, get CUR() { return CUR; }, startLevel, tryStart, play, openMap, save };
boot();
})();
</script>
</body>
</html>
